[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.1.0"
description = "Agenthon 2026 Track 1 coding agent"
requires-python = ">=3.13"
license = "MIT"
# Runtime deps are installed in the image (see docker/Dockerfile) rather than pinned here:
# the agent itself is stdlib-only, and the scientific stack exists for the code it GENERATES.
dependencies = []

[project.scripts]
solve = "agent.solve:main"

[tool.setuptools]
packages = ["agent"]
